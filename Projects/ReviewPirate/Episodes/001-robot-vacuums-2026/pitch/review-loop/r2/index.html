fs" class="ref"></div><p class="small">Scene still + exact narration. Draft voice: Kokoro af_heart. Story/still review does not establish final animation or voice quality.</p></main><script>const S=[{"id": "01", "title": "Eight picks. Three cross-checks.", "photo": "thumbnail-eight-picks-v2.png", "spoken": "Eight sources, eight robot-vacuum winners. We compared their reviews. Here are three cross-checks on four of those picks: pet hair, mopping, and tall doorsteps. The other four stay open.", "body": "", "duration": 12.0, "links": [["Eight-pick source matrix and supporting coverage", "../../research/coverage/coverage.html"]], "audio": "audio/01.wav", "voice": "Kokoro af_heart", "sample_rate": 24000, "peak": 0.3932255208492279}, {"id": "02", "title": "First cut: embedded pet hair", "photo": "otter-evidence-cards.png", "spoken": "Pet hair embedded in carpet? RTINGS finds that both the Saros ten R and original Qrevo Curv struggle with it. So, for that priority, we'd set these two headline winners aside. Its dedicated pet-hair guide is the next stop, with alternatives tested specifically for that job.", "body": "<p class=\"eyebrow\">1 / 3 \u00b7 HAIR EMBEDDED IN CARPET</p><h1>Two winners.<br>One reason to look elsewhere.</h1><table><tr><th>Source finding</th><th>Saros 10R</th><th>Original Qrevo Curv</th></tr><tr><th>RTINGS \u00b7 Aug 2026 guide</th><td>Overall pick</td><td>Upper-midrange pick</td></tr><tr class=\"warn\"><th>RTINGS \u00b7 carpet fur</th><td>Struggles</td><td>Struggles</td></tr><tr><th>TechRadar \u00b7 Aug 2026 guide</th><td>\u2014</td><td>Overall pick</td></tr></table><div class=\"decision\">OUR INFERENCE \u00b7 PET-HAIR PRIORITY<br><s>Saros 10R</s> &nbsp; <s>Original Qrevo Curv</s></div><p class=\"key\">Only for this priority. Not a rejection for every home.<br>\u2014 = no finding presented here, not a negative result.</p><footer>READ NEXT \u2192 RTINGS \u00b7 Best robot vacuums for pet hair</footer>", "duration": 18.88, "links": [["RTINGS: pet-hair alternatives and tests", "https://www.rtings.com/robot-vacuum/reviews/best/pet-hair"], ["RTINGS: general guide behind this exclusion", "https://www.rtings.com/robot-vacuum/reviews/best/robot"]], "audio": "audio/02.wav", "voice": "Kokoro af_heart", "sample_rate": 24000, "peak": 0.4369890093803406}, {"id": "03", "title": "The mopping result does not travel", "photo": "otter-evidence-cards.png", "spoken": "For mopping, the differently named Curv two Flow wins The Hook Up\u2019s seven-model comparison. But Vacuum Wars found weak dried-stain cleaning, even with maximum water. Different tests, conflicting results. We haven't established the cause. We would hold off on choosing the Flow for mopping alone; compare these two tests first.", "body": "<p class=\"eyebrow\">2 / 3 \u00b7 CROSS-CHECK THE MOPPING WINNER</p><h1>Same vacuum.<br>Conflicting mopping evidence.</h1><p class=\"model\">Qrevo Curv 2 Flow <span>\u2260 original Qrevo Curv</span></p><table><tr><th>Exact review</th><th>What that test found</th></tr><tr><th>The Hook Up<br>Apr 8, 2026</th><td class=\"gold\">Combined mopping: 1st of 7<br><small>Includes mud, corners and carpet crossing</small></td></tr><tr><th>Vacuum Wars<br>Feb 26, 2026</th><td class=\"warn\">Weak dried-stain removal<br><small>Max-water score 38 \u00b7 average 112<br>Source points, not percentages</small></td></tr></table><div class=\"decision\">OUR INFERENCE \u2192 HOLD THE MOPPING PICK<br>Read both tests before choosing Curv 2 Flow.</div><p class=\"key\">Different protocols. Cause of disagreement not established.<br>No claim that a later date means firmware fixed it.</p><footer>The Hook Up\u2019s comparison \u2194 Vacuum Wars\u2019 exact-model review</footer>", "duration": 20.29, "links": [["The Hook Up: seven-model comparison / mopping at 12:07", "https://www.youtube.com/watch?v=Pv9_2D_Xc5k&t=727s"], ["Vacuum Wars: exact Curv 2 Flow stain results", "https://vacuumwars.com/roborock-qrevo-curv-2-flow-review/"]], "audio": "audio/03.wav", "voice": "Kokoro af_heart", "sample_rate": 24000, "peak": 0.5006771087646484}, {"id": "04", "title": "A comparison that does narrow the pair", "photo": "otter-threshold-review.png", "spoken": "Tall doorsteps give a clearer comparison. In The Hook Up\u2019s same test, Curv two Flow failed a thirty-millimetre vertical face. The Dreame X sixty cleared fifty millimetres both ways. Between these two, we'd pursue the X sixty for tall thresholds. Watch the demonstration and compare your doorway's shape.", "body": "<p class=\"eyebrow\">3 / 3 \u00b7 SAME TEST, SAME OBSTACLES</p><h1>For tall doorsteps,<br>X60 moves ahead of Flow.</h1><p class=\"model\">The Hook Up \u00b7 April 8, 2026</p><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"A ramp-sided threshold with a vertical face; Curv 2 Flow failed the 30 millimetre vertical face, X60 cleared the 50 millimetre obstacle in both directions\"><path d=\"M35 135 H95 L170 85 H255 V135 H300\" fill=\"#b59659\" stroke=\"#224c3e\" stroke-width=\"3\"/><path d=\"M345 135 H385 L470 50 H555 V135 H610\" fill=\"#b59659\" stroke=\"#224c3e\" stroke-width=\"3\"/><text x=\"160\" y=\"28\" font-size=\"20\" text-anchor=\"middle\" fill=\"#21483e\">Curv 2 Flow</text><text x=\"480\" y=\"25\" font-size=\"20\" text-anchor=\"middle\" fill=\"#21483e\">X60 Max</text><text x=\"275\" y=\"104\" font-size=\"18\" fill=\"#21483e\">30 mm</text><text x=\"563\" y=\"85\" font-size=\"18\" fill=\"#21483e\">50 mm</text><text x=\"170\" y=\"169\" font-size=\"18\" text-anchor=\"middle\" fill=\"#8c4c22\">Vertical face: failed</text><text x=\"480\" y=\"169\" font-size=\"18\" text-anchor=\"middle\" fill=\"#21483e\">Both directions: passed</text></svg><div class=\"decision\">OUR INFERENCE \u00b7 IN THIS PAIR<br>Prioritize X60 Max for tall thresholds.</div><p class=\"key\">Dreame X60 Max Ultra Complete \u00b7 also Tom\u2019s Guide\u2019s overall pick.<br>Test geometry matters. Not a guarantee for every doorway.</p><footer>WATCH \u2192 The Hook Up \u00b7 Threshold-crossing chapter</footer>", "duration": 19.55, "links": [["The Hook Up: full video; use Threshold Crossing chapter", "https://www.youtube.com/watch?v=Pv9_2D_Xc5k"], ["The Hook Up: written threshold test", "https://www.thesmarthomehookup.com/2026-ultimate-robot-vacuum-and-mop-comparison/"]], "audio": "audio/04.wav", "voice": "Kokoro af_heart", "sample_rate": 24000, "peak": 0.5476839542388916}, {"id": "05", "title": "The board now tells you where to go", "photo": "otter-threshold-review.png", "spoken": "We haven't crowned a universal winner. We've ruled two out for embedded fur, flagged a disputed mopping pick, and found a threshold advantage. Each change comes with the original review to explore next. Start with the row that matches your home.", "body": "<p class=\"eyebrow\">THE THREE CROSS-CHECKS, KEPT ON THE BOARD</p><h1>Less guesswork.<br>The right review next.</h1><div class=\"recap\"><div><b>EMBEDDED CARPET FUR \u2192 SET ASIDE</b><br><s>Saros 10R</s> \u00b7 <s>Original Qrevo Curv</s><small>RTINGS \u00b7 pet-hair guide \u2192 alternatives and tests</small></div><div><b>MOPPING \u2192 EVIDENCE DISAGREES</b><br>Curv 2 Flow \u00b7 decision on hold<small>The Hook Up + Vacuum Wars \u2192 compare stain tests</small></div><div><b>TALL THRESHOLDS \u2192 AHEAD IN THIS PAIR</b><br>X60 Max over Curv 2 Flow<small>The Hook Up \u2192 check the obstacle shape</small></div></div><p class=\"key\">Four other headline picks remain open: V70, E25, Shark UV, S8 MaxV.<br>Price and ownership checks still matter before a purchase.</p><footer>OPEN THE ORIGINAL REVIEWS BELOW \u00b7 ALL EIGHT PICKS RETAINED</footer>", "duration": 15.63, "links": [["RTINGS: pet-hair alternatives and tests", "https://www.rtings.com/robot-vacuum/reviews/best/pet-hair"], ["The Hook Up: seven-model comparison / mopping at 12:07", "https://www.youtube.com/watch?v=Pv9_2D_Xc5k&t=727s"], ["Vacuum Wars: exact Curv 2 Flow stain results", "https://vacuumwars.com/roborock-qrevo-curv-2-flow-review/"], ["The Hook Up: full video; use Threshold Crossing chapter", "https://www.youtube.com/watch?v=Pv9_2D_Xc5k"], ["Eight-pick source matrix and supporting coverage", "../../research/coverage/coverage.html"]], "audio": "audio/05.wav", "voice": "Kokoro af_heart", "sample_rate": 24000, "peak": 0.41768860816955566}];let n=0;const pick=document.getElementById('pick');S.forEach((s,i)=>pick.add(new Option((i+1)+' · '+s.title,i)));function rail(){return `<div class="rail"><div><b>Saros 10R</b>${n>0?'Fur priority: set aside':'RTINGS pick'}</div><div><b>Original Curv</b>${n>0?'Fur priority: set aside':'TechRadar pick'}</div><div><b>Curv 2 Flow</b>${n>1?'Mopping: disputed':'Hook Up pick'}</div><div><b>X60 Max</b>${n>2?'Thresholds: ahead of Flow':'Tom’s Guide pick'}</div><div><b>Other four: open</b>V70 · E25 · Shark UV · S8 MaxV</div></div>`}function show(){let s=S[n];pick.value=n;document.getElementById('stage').innerHTML=n===0?`<img class="hero" src="../../assets/${s.photo}"><div class="heroScope">Three cross-checks on four headline picks</div><div class="scope">Selected lead picks · checked Sept 2026 · different dates and cohorts<br>Blank cells are not negative findings. Other four picks stay open.</div>`:`<img class="photo" src="../../assets/${s.photo}"><div class="caption">Illustrative host · not test footage</div><section class="sheet">${s.body}</section>${rail()}`;document.getElementById('words').textContent=s.spoken;document.getElementById('time').textContent=(n+1)+' / '+S.length+' · '+s.duration+' seconds';document.getElementById('refs').innerHTML=s.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('');const a=document.getElementById('audio');a.pause();a.src=s.audio;}pick.onchange=()=>{n=+pick.value;show()};document.getElementById('prev').onclick=()=>{n=Math.max(0,n-1);show()};document.getElementById('next').onclick=()=>{n=Math.min(S.length-1,n+1);show()};show();</script>
