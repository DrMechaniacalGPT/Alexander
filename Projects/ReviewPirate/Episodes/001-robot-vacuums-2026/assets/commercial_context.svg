<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#f4f1ea"/>
<text x="100" y="105" font-family="Arial,sans-serif" font-size="62" font-weight="800" fill="#171717">How does the review get paid?</text>
<text x="100" y="168" font-family="Arial,sans-serif" font-size="28" fill="#6f695f">Possible incentive ≠ proven bias</text>

<g font-family="Arial,sans-serif">
  <text x="100" y="280" font-size="28" font-weight="700" fill="#171717">Source context</text>
  <g font-size="22" font-weight="700">
    <rect x="100" y="320" width="180" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="190" y="355" text-anchor="middle" fill="#171717">BOUGHT</text>
    <rect x="300" y="320" width="180" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="390" y="355" text-anchor="middle" fill="#171717">SAMPLE</text>
    <rect x="500" y="320" width="210" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="605" y="355" text-anchor="middle" fill="#171717">AFFILIATE</text>
    <rect x="730" y="320" width="190" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="825" y="355" text-anchor="middle" fill="#171717">SPONSOR</text>
    <rect x="940" y="320" width="230" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="1055" y="355" text-anchor="middle" fill="#171717">NO SPONSOR</text>
    <rect x="1190" y="320" width="200" height="54" rx="27" fill="#ffffff" stroke="#cfc8bb" stroke-width="2"/><text x="1290" y="355" text-anchor="middle" fill="#171717">UNKNOWN</text>
  </g>

  <text x="100" y="500" font-size="28" font-weight="700" fill="#171717">Public affiliate programs</text>

  <g>
    <text x="100" y="580" font-size="28" font-weight="700" fill="#171717">Roborock</text>
    <rect x="320" y="547" width="300" height="44" rx="22" fill="#ddd8cd"/>
    <rect x="320" y="547" width="105" height="44" rx="22" fill="#6e9f73"/>
    <text x="650" y="579" font-size="26" font-weight="700" fill="#171717">4–7%</text>

    <text x="100" y="665" font-size="28" font-weight="700" fill="#171717">eufy</text>
    <rect x="320" y="632" width="300" height="44" rx="22" fill="#ddd8cd"/>
    <rect x="320" y="632" width="225" height="44" rx="22" fill="#6e9f73"/>
    <text x="650" y="664" font-size="26" font-weight="700" fill="#171717">7–15%</text>

    <text x="100" y="750" font-size="28" font-weight="700" fill="#171717">MOVA</text>
    <rect x="320" y="717" width="300" height="44" rx="22" fill="#ddd8cd"/>
    <rect x="320" y="717" width="300" height="44" rx="22" fill="#6e9f73"/>
    <text x="650" y="749" font-size="26" font-weight="700" fill="#171717">up to ~20%</text>

    <text x="100" y="835" font-size="28" font-weight="700" fill="#171717">Dreame</text>
    <rect x="320" y="802" width="300" height="44" rx="22" fill="#ddd8cd"/>
    <rect x="320" y="802" width="75" height="44" rx="22" fill="#6e9f73"/>
    <text x="650" y="834" font-size="26" font-weight="700" fill="#171717">5%+</text>

    <text x="100" y="920" font-size="28" font-weight="700" fill="#171717">Amazon Home</text>
    <rect x="320" y="887" width="300" height="44" rx="22" fill="#ddd8cd"/>
    <rect x="320" y="887" width="45" height="44" rx="22" fill="#6e9f73"/>
    <text x="650" y="919" font-size="26" font-weight="700" fill="#171717">3%</text>
  </g>
</g>

<text x="1040" y="560" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#171717">Track the money.</text>
<text x="1040" y="620" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#171717">Don't guess the motive.</text>
<text x="1040" y="700" font-family="Arial,sans-serif" font-size="26" fill="#6f695f">Program availability does not prove</text>
<text x="1040" y="742" font-family="Arial,sans-serif" font-size="26" fill="#6f695f">a reviewer uses it — or that it changed a verdict.</text>
</svg>